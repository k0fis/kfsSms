name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o kfsSms.exe .

      - name: Build Linux ARM (Raspberry Pi 3)
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o kfsSms-linux-arm .

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o kfsSms-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kfsSms.exe
            kfsSms-linux-arm
            kfsSms-linux-amd64
